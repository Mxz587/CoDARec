name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: smoke test (CPU, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the reference environment (co-developed with torch 1.12);
        # 3.12 keeps the package honest against a current interpreter.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyTorch (CPU wheel)
        # Installed first on purpose: the CPU wheel satisfies the `torch>=1.12`
        # requirement below, so pip will not pull the much larger CUDA wheel.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: python tests/smoke_test.py
