<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">CoDARec architecture</title>
  <desc id="desc">A user interaction vector is corrupted by a forward diffusion process, denoised by a timestep-conditioned MLP, and sampled back to item scores. An optional PPO policy steers the reverse process.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-rl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- header -->
  <text x="40" y="54" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">CoDARec — training and inference flow</text>
  <text x="40" y="80" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">A user's interaction vector is noised and regenerated by a diffusion model; an optional PPO policy steers the reverse process.</text>

  <!-- main chain arrows -->
  <line x1="214" y1="168" x2="232" y2="168" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="432" y1="168" x2="450" y2="168" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="664" y1="168" x2="682" y2="168" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="882" y1="168" x2="898" y2="168" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- A: user history -->
  <rect x="40" y="120" width="170" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="125" y="158" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">User history</text>
  <text x="125" y="181" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">1 × |I| sparse vector</text>

  <!-- B: forward diffusion -->
  <rect x="238" y="120" width="190" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="333" y="158" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">Forward diffusion</text>
  <text x="333" y="181" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Gaussian noise over T steps</text>

  <!-- C: denoising MLP -->
  <rect x="456" y="120" width="204" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="558" y="158" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">Denoising MLP</text>
  <text x="558" y="181" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">|I| → 1000 → |I|, time emb.</text>

  <!-- D: reverse sampling -->
  <rect x="688" y="120" width="190" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="783" y="158" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">Reverse sampling</text>
  <text x="783" y="181" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">p(xₜ₋₁ | xₜ), ancestral</text>

  <!-- E: ranking output -->
  <rect x="904" y="120" width="242" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="1025" y="158" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1e3a8a">Top-N ranking</text>
  <text x="1025" y="181" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#1e40af">Precision · Recall · NDCG · MRR</text>

  <!-- PPO branch -->
  <rect x="660" y="300" width="246" height="86" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="783" y="336" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#4c1d95">PPO policy (actor-critic)</text>
  <text x="783" y="359" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#5b21b6">experimental · enabled by --use-rl</text>

  <!-- PPO controls the sampler -->
  <line x1="783" y1="300" x2="783" y2="224" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-rl)"/>
  <text x="795" y="266" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7c3aed">guidance g · noise ε</text>

  <!-- reward loop -->
  <polyline points="1025,220 1025,343 914,343" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-rl)"/>
  <text x="1012" y="270" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7c3aed">reward</text>
  <text x="1012" y="288" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#7c3aed">0.7·cos + 0.3·diversity</text>

  <!-- legend -->
  <line x1="40" y1="420" x2="76" y2="420" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="86" y="424" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">diffusion path (default)</text>
  <line x1="290" y1="420" x2="326" y2="420" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-rl)"/>
  <text x="336" y="424" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">PPO branch (experimental)</text>

  <text x="40" y="452" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8">codarec/models/diffusion.py · codarec/models/denoising_mlp.py · codarec/models/rl.py · codarec/engine.py · codarec/metrics.py</text>
</svg>
